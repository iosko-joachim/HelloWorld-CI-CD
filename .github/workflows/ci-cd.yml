# C-001 CI/CD-Workflow (projekt/struktur/C-001.md)
#
# Baut, testet, signiert und reicht die App bei Google Play und im Apple
# App Store ein. Stufen entsprechen I-001 (Push-Trigger), I-002
# (Android-Einreichung), I-003 (iOS-Einreichung) aus projekt/struktur/.
#
# Push: nur Build & Test. Einreichung per Knopfdruck (ADR-004):
# Actions → CI/CD → "Run workflow" → Ziel wählen.

name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ziel:
        description: Wohin einreichen?
        type: choice
        options: [beide, google, apple]
        default: beide

concurrency:
  # Ein Push bricht keine laufende Einreichung ab.
  group: ci-cd-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # I-001 Push-Trigger: Build & Test
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build & Test
        run: ./gradlew build

      - name: Android-Release-Bundle bauen
        if: github.event_name == 'workflow_dispatch' && inputs.ziel != 'apple'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          ./gradlew :androidApp:bundleRelease

      - uses: actions/upload-artifact@v5
        if: github.event_name == 'workflow_dispatch' && inputs.ziel != 'apple'
        with:
          name: android-release-aab
          path: androidApp/build/outputs/bundle/release/*.aab
          retention-days: 7

  # I-002 Android-Einreichung: an X-002 (Google Play Console) über X-004 (Fastlane)
  deploy-android:
    name: Android-Einreichung
    needs: build-test
    if: github.event_name == 'workflow_dispatch' && inputs.ziel != 'apple'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: android-release-aab
          path: androidApp/build/outputs/bundle/release/

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Fastlane – Play-Console-Upload
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        # Fastlane-Fehler als Annotation, damit sie in der Lauf-Zusammenfassung stehen.
        run: |
          set +e
          bundle exec fastlane android deploy 2>&1 | tee fastlane.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(grep -E '^\[!\]' fastlane.log | tail -1)
            echo "::error title=Fastlane::${msg:-siehe Protokoll}"
          fi
          exit "$status"

  # I-003 iOS-Einreichung: an X-003 (Apple App Store Connect) über X-004 (Fastlane)
  # Läuft auf macOS, weil das Xcode-Archiv nur dort gebaut werden kann (RISK-005).
  deploy-ios:
    name: iOS-Build & Einreichung
    needs: build-test
    if: github.event_name == 'workflow_dispatch' && inputs.ziel != 'google'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Fastlane – Build, Signierung, App-Store-Connect-Upload
        # Nicht geheime Apple-Kennungen stehen in fastlane/.env.default.
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        # Fastlane-Fehler als Annotation, damit sie in der Lauf-Zusammenfassung stehen.
        run: |
          set +e
          bundle exec fastlane ios deploy 2>&1 | tee fastlane.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(grep -E '^\[!\]' fastlane.log | tail -1)
            echo "::error title=Fastlane::${msg:-siehe Protokoll}"
          fi
          exit "$status"
